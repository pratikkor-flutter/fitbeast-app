name: fitbeast
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  build_runner: ^2.4.15
  carousel_slider: ^5.1.1
  cloud_firestore: ^5.6.8
  device_info_plus: ^11.4.0
